<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNIZULU AssetManager</title>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #002147;
      --accent: #ffd100;
      --background: #f4f6f8;
      --white: #fff;
      --danger: #d7263d;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .screen, #dashboard {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, var(--primary) 70%, var(--accent) 100%);
      color: var(--white);
    }

    .active {
      display: flex;
    }

    .card {
      background: var(--white);
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--primary);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    .card .logo {
      width: 70px;
      margin-bottom: 1rem;
    }

    .card input {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .card button {
      width: 100%;
      padding: 0.7rem;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .card button:hover {
      background: var(--accent);
      color: var(--primary);
    }

    .choice-buttons button {
      margin: 0.5rem;
      padding: 1rem 2rem;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .choice-buttons button:hover {
      background: var(--accent);
      color: var(--primary);
    }

    #dashboard {
      flex: 1;
      flex-direction: row;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #f0f0f0;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Step 1: Role Selection -->
  <div id="role-screen" class="screen active">
    <div class="card">
      <img src="logo.png" alt="UNIZULU Logo" class="logo" />
      <h2>Workflow Automation for University-Issued Asset Management</h2>
      <p>Are you a Staff member or ICT member?</p>
      <div class="choice-buttons">
        <button id="staffBtn">Staff</button>
        <button id="ictBtn">ICT</button>
      </div>
    </div>
  </div>

  <!-- Step 2: ICT Login -->
  <div id="ict-login" class="screen">
    <div class="card">
      <img src="logo.png" alt="UNIZULU Logo" class="logo" />
      <h2>ICT Member Login</h2>
      <form id="ict-form">
        <input type="text" id="ict-id" placeholder="Enter Identification" required/>
        <input type="password" id="ict-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <div id="ict-status" style="margin-top:10px; font-weight:bold;"></div>
    </div>
  </div>

  <!-- Step 2: Staff Login (Supabase validation) -->
  <div id="staff-login" class="screen">
    <div class="card">
      <img src="logo.png" alt="UNIZULU Logo" class="logo" />
      <h2>Staff Member Login</h2>
      <form id="staff-form">
        <input type="text" id="staff-id" placeholder="Staff ID" required />
        <input type="password" id="staff-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <div id="staff-status" style="color: red; margin-top: 8px;"></div>
    </div>
  </div>

  <!-- Step 3: Dashboard -->
  <div id="dashboard">
    <aside class="sidebar">
      <h2>AssetManager</h2>
    </aside>
    <div class="main" style="flex:1; display:flex; justify-content:center; align-items:center;">
      <h2>Welcome to the Asset Management Dashboard</h2>
    </div>
  </div>

  <footer>
    &copy; 2025 University of Zululand. AssetManager. All rights reserved.
  </footer>

  <!-- Supabase and Logic -->
  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = "https://bssymyrxjtxuldpapokh.supabase.co"; 
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzc3lteXJ4anR4dWxkcGFwb2toIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MjExNTAsImV4cCI6MjA3MzA5NzE1MH0.zb5ksGUDFdQCoD7-a9yDE3bERKw3MsvJ1__g4YFtDxY"; 
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const roleScreen = document.getElementById('role-screen');
  const ictLogin = document.getElementById('ict-login');
  const staffLogin = document.getElementById('staff-login');

  // Step 1: Role selection
  document.getElementById('ictBtn').addEventListener('click', () => {
    roleScreen.classList.remove('active');
    ictLogin.classList.add('active');
  });

  document.getElementById('staffBtn').addEventListener('click', () => {
    roleScreen.classList.remove('active');
    staffLogin.classList.add('active');
  });

  // Step 2: ICT login (unchanged)
  document.getElementById('ict-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const identification = document.getElementById('ict-id').value.trim();
  const password = document.getElementById('ict-password').value.trim();
  const statusDiv = document.getElementById('ict-status');
  statusDiv.style.color = "black";
  statusDiv.textContent = "Checking credentials...";

  try {
    const { data, error } = await supabase
      .from('ICT_Credentials')
      .select('*')
      .eq('Identification', identification)
      .eq('Password', password)
      .single();

    console.log({ data, error }); // 👈 helps debug in console

    if (error || !data) {
      statusDiv.style.color = "red";
      statusDiv.textContent = "Invalid Identification or Password.";
      return;
    }

    statusDiv.style.color = "green";
    statusDiv.textContent = "Login successful! Redirecting...";

    setTimeout(() => {
      window.location.href = "http://localhost:5678/webhook/499666c3-d807-4bb7-8195-43932f64a91f/chat";
    }, 1200);

  } catch (err) {
    console.error("Error:", err);
    statusDiv.style.color = "red";
    statusDiv.textContent = "Error connecting to database.";
  }
});

  // Step 3: Staff login with Supabase validation
  document.getElementById('staff-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const staffID = document.getElementById('staff-id').value.trim();
    const password = document.getElementById('staff-password').value.trim();
    const statusDiv = document.getElementById('staff-status');
    statusDiv.style.color = "black";
    statusDiv.textContent = "Checking credentials...";

    try {
      const { data, error } = await supabase
        .from('Passwords')
        .select('*')
        .eq('Staff_ID', staffID)
        .eq('Passwords', password)
        .single();
      
        
      console.log({ data, error }); // 👈 helps debug in console

      if (error || !data) {
        statusDiv.style.color = "red";
        statusDiv.textContent = "Invalid Staff ID or Password.";
        return;
      }

      statusDiv.style.color = "green";
      statusDiv.textContent = "Login successful! Redirecting...";

      setTimeout(() => {
        window.location.href = "http://localhost:5678/webhook/f8859f39-6714-4454-bda8-6a780e8f4730/chat";
      }, 1200);

    } catch (err) {
      console.error("Error:", err);
      statusDiv.style.color = "red";
      statusDiv.textContent = "Error connecting to database.";
    }
  });
</script>


</body>
</html>
